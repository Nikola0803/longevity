# One command local Postgres for the Command Center app.
#   docker compose up -d        # start the DB
#   docker compose down         # stop it (data persists in the named volume)
# Credentials here match DATABASE_URL in .env, so nothing else to configure.
services:
  db:
    image: postgres:16-alpine
    container_name: peptides_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vertalis
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - peptides_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  peptides_pgdata:
